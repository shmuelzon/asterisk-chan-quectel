;
; chan_quectel - Quectel EC25-E channel driver
;

[general]

;
; One section per modem. The section name is the device name used in dial
; strings: Dial(Quectel/quectel0/0501234567)
;
[quectel0]
data=/dev/ttyUSB2          ; AT command port
alsadev=hw:Android         ; ALSA device of the EC25 USB Audio interface
context=incoming-mobile    ; dialplan context for incoming calls and SMS
exten=s                    ; extension started for incoming calls
language=en
group=0                    ; dial group, for Quectel/g0/<number>

; RX gain, 0-65535. The modem's own default of 8192 is roughly 44 dB too
; quiet over the USB audio path - leave this at maximum unless you have
; measured otherwise.
rxgain=65535

; TX (microphone) gain, 0-65535. -1 leaves the modem's setting alone.
txgain=-1

;
; Delete each message from the modem's storage once it has been handed to the
; dialplan. Storage holds only 255 messages and nothing else prunes it, so
; turning this off will eventually stop delivery altogether.
;autodeletesms=yes

;resetmodem=no             ; send ATZ during initialisation
;disabled=no
